<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Roboto:wght@400;700&display=swap"
		/>
		<script>
			// NightRide look from 10 PM to 2 AM campus time, set before first paint.
			// ?theme=night or ?theme=day previews either; it sticks while you navigate in the app.
			(() => {
				const q = new URLSearchParams(location.search).get('theme');
				const h = +new Date().toLocaleString('en-US', {
					timeZone: 'America/New_York',
					hour: 'numeric',
					hourCycle: 'h23'
				});
				if (q === 'night' || (q !== 'day' && (h >= 22 || h < 2)))
					document.documentElement.dataset.theme = 'night';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
